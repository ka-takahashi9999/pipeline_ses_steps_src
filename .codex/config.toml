# Codex CLI 0.147.0 設定
# プロジェクト共通ルールは AGENTS.md が正本（instructions には重複記述しない）
# Skill は .agents/skills/ を参照（$step-implementation / $pipeline-review / $pipeline-sync-git）

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[shell_environment_policy]
include_only = ["PATH", "HOME"]

# execpolicy rules: .codex/rules/pipeline.rules
#   正規sync/gitスクリプトのみ allow、破壊的Git操作は forbidden
#   検証: codex execpolicy check --rules .codex/rules/pipeline.rules <command...>
#
# TODO: approvals_reviewer = "auto_review" は 0.147.0 で有効か未確認のため未採用
